<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Mahsulot qo'shish</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-dark text-white text-center rounded-top-4">
                    <h4 class="mb-0">Yangi mahsulot qo‘shish</h4>
                </div>

                <div class="card-body p-4">

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Category -->
                        <div class="mb-3">
                            <label class="form-label">Kategoriya</label>
                            <select name="category" class="form-select">
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Title -->
                        <div class="mb-3">
                            <label class="form-label">Mahsulot nomi</label>
                            <input type="text" name="title" class="form-control" placeholder="Mahsulot nomi">
                        </div>

                        <!-- Stock -->
                        <div class="mb-3">
                            <label class="form-label">Soni</label>
                            <input type="number" name="stock" class="form-control" placeholder="Masalan: 10">
                        </div>

                        <!-- Price -->
                        <div class="mb-3">
                            <label class="form-label">Narxi</label>
                            <input type="number" name="price" class="form-control" placeholder="Masalan: 5000">
                        </div>

                        <!-- Status -->
                        <div class="mb-4">
                            <label class="form-label">Holati</label>
                            <select name="status" class="form-select">
                                <option value="new">Yangi</option>
                                <option value="be_sold">Sotuvda</option>
                                <option value="pantry">Omborda</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark btn-lg rounded-3">
                                Saqlash
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
